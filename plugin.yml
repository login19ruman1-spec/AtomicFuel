# AtomicFuel — полная инструкция игроку

## 1. Что даёт реактор

Активный реактор имеет три игровых преимущества:

### Энергия

Каждый тик реактор генерирует AtomicEnergy.

Формула базовой генерации:

```text
(base + per-enrichment × enrichment)
× (1 + 0.25 × reflectors)
× stability
```

При обычных настройках:

```text
10 + 5 × enrichment
```

При обогащении 1 это 15 AtomicEnergy/тик до коэффициентов стабильности/охлаждения.

Энергия поступает в соседние Redstone Block. Copper Block образуют проводящую сеть между реактором и другими Redstone Block.

AtomicBattery забирает энергию из Redstone Buffer по ПКМ.

### Ресурсы

Раз в 60 секунд реактор ищет соседний сундук и может положить туда:

- Tritium Dust;
- Enriched Iron;
- Rare Isotope.

Шанс растёт с температурой, поэтому горячий реактор прибыльнее, но опаснее.

### Баффы

В радиусе 16 блоков стабильный реактор выдаёт:

- Haste I;
- Night Vision;
- Regeneration I.

При нестабильности баффы заменяются на:

- Wither I;
- Poison I;
- Nausea I;
- Weakness I.

---

## 2. Крафт топлива

### AtomicFuelRod

```text
BLAZE POWDER   GUNPOWDER       BLAZE POWDER
GUNPOWDER      NETHERITE SCRAP GUNPOWDER
BLAZE POWDER   GUNPOWDER       BLAZE POWDER
```

Результат: `AtomicFuelRod ×1`.

### FuelRodBlock

```text
AtomicFuelRod  AtomicFuelRod  AtomicFuelRod
AtomicFuelRod  AtomicFuelRod  AtomicFuelRod
AtomicFuelRod  AtomicFuelRod  AtomicFuelRod
```

Результат: `FuelRodBlock ×1`.

---

## 3. Как построить реактор

Поставьте FuelRodBlock в центр.

Вокруг него должен быть точно такой слой:

```text
[IRON]       [REDSTONE]       [IRON]
[REDSTONE]   [FUEL ROD]       [REDSTONE]
[IRON]       [REDSTONE]       [IRON]
```

Непосредственно над этим слоем поставьте 3×3 обычной воды:

```text
[WATER] [WATER] [WATER]
[WATER] [WATER] [WATER]
[WATER] [WATER] [WATER]
```

Вода должна находиться на `Y + 1` относительно FuelRodBlock.

---

## 4. Запуск

Скрафтите ControlRod.

ПКМ ControlRod по FuelRodBlock.

Если каркас и вода правильные, FuelRodBlock становится ActiveFuelRodBlock.

Если запуск не удался, плагин сообщит, что неверно в конструкции.

---

## 5. ControlRod

ПКМ ControlRod по активному реактору.

Каждый установленный ControlRod:

- увеличивает стабильность на 25;
- считается частью конфигурации реактора.

Количество хранится после рестарта.

---

## 6. CoolantCell

ПКМ CoolantCell по активному реактору.

Каждая ячейка уменьшает нагрев примерно на 0.5°C/тик.

Это не заменяет водяной слой: для нормальной работы вода всё равно обязательна.

---

## 7. NeutronReflector

ПКМ NeutronReflector по активному реактору.

Каждый отражатель увеличивает генерацию AtomicEnergy на 25%.

---

## 8. Обогащение

AtomicFuelRod имеет PDC-параметр `Enrichment`.

Обычный крафтовый стержень начинается с:

```text
Enrichment: 1
```

ПКМ AtomicFuelRod по активному реактору увеличивает обогащение на значение стержня.

Максимум по умолчанию:

```text
10
```

При достижении максимума новый стержень не расходуется.

---

## 9. Энергетическая сеть

Схема:

```text
                 Active Reactor
                       |
                 Redstone Block
                       |
                  Copper Block
                 /            \
        Copper Block       Redstone Block
                               |
                         AtomicBattery
```

### Redstone Block

Работает как энергетический буфер.

Вместимость по умолчанию: `500000 AtomicEnergy`.

### Copper Block

Проводит энергию по цепочке Copper Block.

### AtomicBattery

ПКМ батареей по Redstone Block.

За одно действие переносится до `1000 AtomicEnergy`.

Можно также нажать батареей на активный реактор: плагин попробует забрать энергию из соседнего Redstone Buffer.

Максимальная ёмкость батареи: `100000 AtomicEnergy`.

---

## 10. Охлаждение водой

Пока весь верхний слой состоит из обычной воды, реактор охлаждается.

Через 30 секунд вода становится `ChargedWater`.

Визуально это светло-синий блок.

ChargedWater:

- больше не охлаждает;
- увеличивает нагрев;
- сохраняется как кастомная PDC-метка;
- может быть извлечена ведром.

Чтобы продолжить охлаждение, возьмите ChargedWater ведром.

Вы получите `Radioactive Water Bucket` и получите Wither I на 30 секунд.

После этого замените воду в охлаждающем слое обычной водой.

---

## 11. Radioactive Water Bucket

ПКМ этим ведром по блоку.

В месте разлива создаётся RadiationZone радиусом 8 блоков.

Ведро превращается обратно в обычное.

---

## 12. RadiationZone

Каждые 20 тиков игроки внутри получают:

- Wither I;
- Poison I;
- Nausea I;
- Weakness I.

Визуальные эффекты:

- SPORE_BLOSSOM_AIR;
- WARPED_SPORE;
- звуки радиационной зоны.

Среда внутри зоны постепенно портится:

- вода становится ChargedWater;
- трава и листья уничтожаются или становятся Dead Bush;
- земля/трава превращаются в Coarse Dirt или Mycelium.

Обычная вода, размещённая внутри зоны, уменьшает заражение.

---

## 13. RadAway

ПКМ RadAway.

Он:

- удаляет Wither/Poison/Nausea/Weakness;
- уменьшает ближайшие RadiationZone на 5 блоков по умолчанию.

---

## 14. GeigerCounter

Возьмите GeigerCounter и ПКМ.

В action bar появится уровень радиации от 0 до 100 в текущей точке.

Чем ближе центр зоны, тем выше значение.

---

## 15. Авария реактора

Критическая температура:

```text
900°C
```

При достижении порога начинается 10-секундный countdown.

Каждую секунду:

- звучит сирена;
- появляются дымовые частицы;
- при последних секундах игрокам показывается предупреждение.

### Как остановить

Администратор может выполнить:

```text
/atomicfuel stabilize
```

Команда стабилизирует ближайший реактор, сбрасывает countdown и снижает температуру на 150°C.

Игроки могут заранее использовать ControlRod и CoolantCell, чтобы не допустить аварии.

---

## 16. Взрыв

Если countdown закончился, происходит обычный Minecraft explosion с параметрами из config.

По умолчанию:

```text
Power: 40
Fire: true
Destroy blocks: true
Knockback: 2.5
Crater radius: 8
```

После взрыва:

1. создаётся RadiationZone радиусом 30;
2. в центре появляется RadioactiveCore;
3. рядом появляются Mycelium и Dead Bush;
4. сущности отбрасываются ударной волной;
5. зона расширяется на 1 блок каждые 30 секунд;
6. зона исчезает через 120 секунд.

Это исключительно игровая Minecraft-механика.

---

## 17. RadioactiveCore

RadioactiveCore — центральный маркер аварийной зоны.

ПКМ по нему показывает текущий уровень радиации.

Администратор может сломать его как обычный блок; выпадения предмета нет.

---

## 18. Полная последовательность игры

```text
1. Скрафтить 9 AtomicFuelRod
2. Скрафтить FuelRodBlock
3. Построить железно-красстоуновый каркас
4. Поставить 3×3 воды сверху
5. Скрафтить ControlRod
6. ПКМ по FuelRodBlock
7. Получить ActiveFuelRodBlock
8. Поставить Redstone Block
9. При желании проложить Copper Block
10. Скрафтить AtomicBattery
11. Заряжать батарею из Redstone Buffer
12. Установить CoolantCell
13. Установить NeutronReflector
14. Увеличивать Enrichment AtomicFuelRod
15. Поставить сундук рядом
16. Следить за температурой через /atomicfuel status
17. Следить за радиацией GeigerCounter
18. При аварии стабилизировать реактор
19. Если произошёл взрыв — очистить зону водой/RadAway/командой cleanup
```

### Влияние NeutronReflector на аварию

Каждый установленный NeutronReflector увеличивает игровую мощность аварийного взрыва на 0.5 и стартовый радиус пост-аварийной RadiationZone на 2 блока. Это специально сделано как игровая компенсация за повышенную выработку энергии.
